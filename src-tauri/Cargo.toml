[package]
name = "app"
version = "0.1.0"
description = "Desktop decoration app"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
os_info = "3"
tokio = { version = "1", features = ["time"] }

# Same versions tauri 2.12.7 already pulls in, so the tree keeps one copy of each.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-core-foundation",
    "NSArray", "NSDictionary", "NSGeometry", "NSNotification", "NSOperation", "NSString", "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-core-foundation",
    "NSApplication", "NSEvent", "NSResponder", "NSScreen", "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow", "CGWindowLevel"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

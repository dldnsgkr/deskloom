name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check:name
      - run: pnpm test:rust

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Read app name
        shell: bash
        run: echo "APP_NAME=$(node -p "require('./src-tauri/tauri.conf.json').productName")" >> "$GITHUB_ENV"

      - name: Build macOS universal app
        if: runner.os == 'macOS'
        run: pnpm tauri build --target universal-apple-darwin --bundles app
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/${APP_NAME}.app" "${APP_NAME}-macos.zip"
      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ env.APP_NAME }}-macos.zip
          if-no-files-found: error

      - name: Build Windows exe
        if: runner.os == 'Windows'
        run: pnpm tauri build --no-bundle
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/${{ env.APP_NAME }}.exe
          if-no-files-found: error
